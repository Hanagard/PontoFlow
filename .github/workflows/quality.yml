name: PontoFlow quality checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "audit/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-unit:
    name: Backend domain and security tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      MONGO_URL: mongodb://127.0.0.1:27017
      DB_NAME: pontoflow_ci
      APP_ENV: test
      SESSION_SECRET: ci-only-secret-not-for-production-00000000000000000000000000000000
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install fastapi pydantic pymongo motor pyjwt passlib bcrypt==4.0.1 pytest pytest-xdist email-validator python-dotenv
      - name: Run domain and security tests
        run: pytest -q tests/test_calc.py tests/test_security.py

